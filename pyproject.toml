[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-research-toolkit"
version = "1.0.0"
description = "A modular Python toolkit for processing, analyzing, and synthesizing academic PDF documents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Academic Research Toolkit Contributors"}
]
keywords = [
    "academic",
    "research",
    "pdf",
    "citation",
    "bibliography",
    "theme-analysis",
    "text-extraction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
    "Topic :: Education",
]
dependencies = [
    "pdfplumber>=0.9.0",
    "pypdf>=3.0.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.18.0",
]
mcp = [
    "fastmcp>=0.1.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
]
enrichment = [
    "httpx>=0.24.0",
]
visualization = [
    "plotly>=5.0.0",
    "networkx>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
all = [
    "academic-research-toolkit[ai,mcp,api,enrichment,visualization,dev]",
]

[project.scripts]
research-toolkit = "academic_research_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/michalvalco/academic-research-toolkit"
Documentation = "https://github.com/michalvalco/academic-research-toolkit#readme"
Repository = "https://github.com/michalvalco/academic-research-toolkit.git"
Issues = "https://github.com/michalvalco/academic-research-toolkit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["academic_research_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["academic_research_toolkit"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
